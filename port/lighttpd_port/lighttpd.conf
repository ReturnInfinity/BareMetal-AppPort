# lighttpd.conf -- default config for lighttpd.app (BareMetal-AppPort).
# Installed as /lighttpd/lighttpd.conf on the EXT2 disk image by
# install.sh; lighttpd.c points lighttpd at that path.

server.document-root = "/lighttpd/www"
server.port          = 80
server.bind          = "0.0.0.0"

# No server.errorlog: lighttpd runs in the foreground (-D), so it logs
# to stderr, which is the VM's serial console.

server.modules = (
	"mod_access",
	"mod_status",
)

index-file.names     = ( "index.html" )
dir-listing.activate = "enable"
status.status-url    = "/server-status"

# Every connection uses one of net_shim.c's 16 sockets (one more is
# the listener), so keep lighttpd's own connection limit inside that.
# server.max-fds isn't a count here so much as the highest fd number
# lighttpd may see: it indexes its tables by fd, and this port numbers
# EXT2 fds from 3, /dev/null from 90 and sockets from 100 to 115.
server.max-connections = 12
server.max-fds         = 128

# Request bodies too big to keep in memory are spooled here.
server.upload-dirs     = ( "/lighttpd/tmp" )

mimetype.assign = (
	".html" => "text/html",
	".txt"  => "text/plain",
	".css"  => "text/css",
	".js"   => "text/javascript",
	".json" => "application/json",
	".png"  => "image/png",
	".jpg"  => "image/jpeg",
	".svg"  => "image/svg+xml",
	""      => "application/octet-stream",
)
